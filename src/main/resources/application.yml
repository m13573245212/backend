server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/study_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload:
    dir: ./uploads/files
    image-dir: ./uploads/images
#    base-url: /api/files/images

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.filemanagement.entity

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

logging:
  config: classpath:logback-spring.xml
  file:
    path: ./logs
